# Produção na VPS: um container por serviço, só o Caddy expõe portas.
# Cloudflare na frente (DNS proxied, SSL Full strict com Origin Certificate).
# Uso: cp .env.example .env && docker compose -f docker-compose.prod.yml up -d
name: centelha

# Logs em JSON no stdout de cada container; o Docker guarda com rotação para não
# encher o disco da VPS. Ler: docker compose logs -f api worker
x-logs: &logs
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  caddy:
    logging: *logs
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./certs:/certs:ro # origin.pem e origin.key gerados no painel da Cloudflare
      - caddy_data:/data
      - audio:/srv/audio:ro
    environment:
      DOMINIO: ${DOMINIO}
    # Admin do Caddy só em localhost dentro do container: responde se o Caddy está de pé.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2019/config/"]
      interval: 30s
      timeout: 3s
      retries: 3
    depends_on:
      site: { condition: service_healthy }
      api: { condition: service_healthy }
    networks: [borda]

  site:
    logging: *logs
    image: ghcr.io/laudofacilappbr/centelha-site:${TAG:-latest}
    restart: unless-stopped
    # Healthcheck vem da imagem (site/Dockerfile), como o da api.
    # Serve /srv/site/atual: o site da imagem até o site-construtor gerar outro (#42).
    volumes: [site:/srv/site]
    networks: [borda]

  # Regera o site quando o conteúdo publicado muda (#42): lê a marca da API interna,
  # faz o build e troca a versão que o site serve. Build quebrado não derruba o site.
  site-construtor:
    logging: *logs
    image: ghcr.io/laudofacilappbr/centelha-site-construtor:${TAG:-latest}
    restart: unless-stopped
    environment:
      CATALOGO_API_URL: http://api:8000
      # Os mesmos endereços públicos da imagem do site; o do áudio entra na CSP.
      SITE_URL: https://${DOMINIO}
      PUBLIC_API_URL: https://api.${DOMINIO}
      AUDIO_URL: https://audio.${DOMINIO}
    volumes: [site:/srv/site]
    depends_on:
      site: { condition: service_healthy }
      api: { condition: service_healthy }
    # Só a rede interna: fala com a api e não precisa de internet.
    networks: [interna]

  api:
    logging: *logs
    image: ghcr.io/laudofacilappbr/centelha-api:${TAG:-latest}
    restart: unless-stopped
    environment:
      CENTELHA_DATABASE_URL: postgresql+psycopg://centelha:${POSTGRES_PASSWORD}@postgres:5432/centelha
      CENTELHA_CORS_ORIGINS: '["https://${DOMINIO}","https://www.${DOMINIO}"]'
      CENTELHA_AMBIENTE: producao
      CENTELHA_SENTRY_DSN: ${CENTELHA_SENTRY_DSN:-}
      # A api entrega ao app a chave de cada faixa cifrada (#73); a mesma do worker.
      CENTELHA_AUDIO_CHAVE_MESTRA: ${CENTELHA_AUDIO_CHAVE_MESTRA:-}
    depends_on:
      postgres: { condition: service_healthy }
    networks: [borda, interna]

  worker:
    logging: *logs
    image: ghcr.io/laudofacilappbr/centelha-worker:${TAG:-latest}
    restart: unless-stopped
    environment:
      CENTELHA_DATABASE_URL: postgresql+psycopg://centelha:${POSTGRES_PASSWORD}@postgres:5432/centelha
      CENTELHA_AUDIO_URL_BASE: https://audio.${DOMINIO}
      CENTELHA_AMBIENTE: producao
      CENTELHA_SENTRY_DSN: ${CENTELHA_SENTRY_DSN:-}
      # Motor inicial: Piper, no container ao lado (ADR 0005).
      CENTELHA_PIPER_URL: http://piper:5000
      # Motores pagos, para a migração ao Azure (ADR 0005); vazios até lá.
      CENTELHA_AZURE_TTS_KEY: ${CENTELHA_AZURE_TTS_KEY:-}
      CENTELHA_AZURE_TTS_REGION: ${CENTELHA_AZURE_TTS_REGION:-}
      CENTELHA_GOOGLE_TTS_KEY: ${CENTELHA_GOOGLE_TTS_KEY:-}
      # "segmento" ou "bloco" (#77); o padrão sai da escuta, junto com o motor.
      CENTELHA_TTS_MODO: ${CENTELHA_TTS_MODO:-segmento}
      # Áudio cifrado (ADR 0004): desligado até o app decifrar.
      CENTELHA_AUDIO_CIFRAR: ${CENTELHA_AUDIO_CIFRAR:-false}
      CENTELHA_AUDIO_CHAVE_MESTRA: ${CENTELHA_AUDIO_CHAVE_MESTRA:-}
    volumes: [audio:/data/audio]
    depends_on:
      postgres: { condition: service_healthy }
      piper: { condition: service_healthy }
    # Só fala com o banco e com o provedor de TTS; não precisa da rede de borda,
    # mas precisa de saída para a internet, que a rede interna não tem.
    # Sem porta HTTP: saudável se consegue falar com o banco, que é de onde vem o trabalho.
    healthcheck:
      test: ["CMD", "python", "-c", "from sqlalchemy import text; from centelha_api.db import engine; engine.connect().execute(text('select 1'))"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [interna, saida]

  # TTS local: vozes dentro da imagem, então não precisa de internet. Só na rede
  # interna, sem porta publicada.
  piper:
    logging: *logs
    image: ghcr.io/laudofacilappbr/centelha-piper:${TAG:-latest}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/voices', timeout=5)"]
      interval: 60s
      timeout: 10s
      retries: 3
    networks: [interna]

  # Backup diário do banco e do áudio, cifrado, para um bucket S3 (R2 ou B2). Restaurar:
  # infra/backup/restaurar.sh. Sem BACKUP_SENHA guardada fora da VPS, não há volta.
  backup:
    logging: *logs
    image: ghcr.io/laudofacilappbr/centelha-backup:${TAG:-latest}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGUSER: centelha
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: centelha
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
      BACKUP_SENHA: ${BACKUP_SENHA:-}
      BACKUP_RETENCAO_DIAS: ${BACKUP_RETENCAO_DIAS:-30}
      BACKUP_HORA: ${BACKUP_HORA:-6}
    volumes: [audio:/data/audio]
    depends_on:
      postgres: { condition: service_healthy }
    # Banco pela rede interna; bucket pela internet.
    networks: [interna, saida]

  postgres:
    logging: *logs
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: centelha
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: centelha
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U centelha -d centelha"]
      interval: 10s
      retries: 10
    networks: [interna]

volumes:
  pgdata:
  caddy_data:
  # Faixas geradas pelo worker; entra no backup junto com o banco (#26).
  audio:
  # Versões do site geradas pelo site-construtor; refeitas a partir da API, sem backup.
  site:

networks:
  borda:
  interna:
    internal: true
  saida:
