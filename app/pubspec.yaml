name: centelha
description: "Centelha: audiolivros espíritas"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  audio_service: ^0.18.19
  audio_session: ^0.2.4
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  http: ^1.6.0
  intl: ^0.20.3
  just_audio: ^0.10.6
  path_provider: ^2.1.6
  pointycastle: ^4.0.0
  share_plus: ^13.3.1
  shared_preferences: ^2.5.6
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.3

flutter:
  # Sem --flavor, o build é o do app principal (#50).
  default-flavor: principal
  uses-material-design: true
  # Gera lib/l10n/app_localizations.dart a partir dos .arb (l10n.yaml).
  generate: true

  assets:
    - assets/fonts/OFL-Comfortaa.txt
    - assets/fonts/OFL-AtkinsonHyperlegible.txt
    # Ícones da marca (docs-iniciais/centelha-brand/assets/icons).
    - assets/icones/

  # Fontes da marca empacotadas (SIL OFL): nada é baixado do Google em tempo de uso,
  # o que importa para o perfil infantil e para quem ouve offline.
  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/fonts/Comfortaa.ttf
    - family: AtkinsonHyperlegible
      fonts:
        - asset: assets/fonts/AtkinsonHyperlegible-Regular.ttf
        - asset: assets/fonts/AtkinsonHyperlegible-Bold.ttf
          weight: 700
