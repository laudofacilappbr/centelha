<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844"><rect width="390" height="844" rx="38" fill="#FFFDF8"/><text x="24" y="50" fill="#4B4947" font-family="Arial" font-size="13">09:41</text><text x="24" y="104" fill="#000F3B" font-family="Comfortaa" font-size="22" font-weight="700">Leitura acompanhada</text><text x="24" y="136" fill="#4B4947" font-family="Arial" font-size="14">Capítulo III</text><rect x="24" y="164" width="342" height="520" rx="24" fill="#FFFFFF"/><text x="42" y="210" fill="#000F3B" font-family="Arial" font-size="16">Os seres que chamamos anjos,</text><text x="42" y="244" fill="#000F3B" font-family="Arial" font-size="16">arcanjos, serafins, formam uma</text><rect x="42" y="258" width="285" height="30" rx="8" fill="#8A5A00" opacity=".18"/><text x="42" y="278" fill="#000F3B" font-family="Arial" font-size="16">categoria especial de natureza</text><text x="42" y="312" fill="#000F3B" font-family="Arial" font-size="16">diferente da dos outros Espíritos?</text><text x="42" y="364" fill="#000F3B" font-family="Arial" font-size="16">— Não; são os Espíritos puros:</text><text x="42" y="398" fill="#000F3B" font-family="Arial" font-size="16">os que se acham no mais alto grau</text><text x="42" y="432" fill="#000F3B" font-family="Arial" font-size="16">da escala e reúnem todas as</text><text x="42" y="466" fill="#000F3B" font-family="Arial" font-size="16">perfeições.</text><rect x="24" y="710" width="342" height="92" rx="24" fill="#F7F2E7"/><circle cx="66" cy="756" r="24" fill="#8A5A00"/><path d="M59 744v24l17-12z" fill="#FFFFFF"/><text x="108" y="750" fill="#000F3B" font-family="Arial" font-size="14" font-weight="700">Ouvir trecho</text><text x="108" y="774" fill="#4B4947" font-family="Arial" font-size="12">Texto acompanha a narração</text></svg>