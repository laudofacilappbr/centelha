name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: centelha
          POSTGRES_PASSWORD: centelha
          POSTGRES_DB: centelha_test
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U centelha" --health-interval 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - name: Migrações batem com os modelos
        env:
          CENTELHA_DATABASE_URL: postgresql+psycopg://centelha:centelha@localhost:55432/centelha_mig
          PGPASSWORD: centelha
        run: |
          # Banco limpo: os testes criam tabelas com create_all no centelha_test.
          psql -h localhost -p 55432 -U centelha -d centelha_test -c "create database centelha_mig"
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base

  site:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build

  imagens:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [api, site]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { servico: api, contexto: api, alvo: api }
          - { servico: worker, contexto: api, alvo: worker }
          - { servico: site, contexto: site, alvo: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          target: ${{ matrix.alvo }}
          push: true
          build-args: |
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.centelha.com.br' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/centelha-${{ matrix.servico }}:latest
            ghcr.io/${{ github.repository_owner }}/centelha-${{ matrix.servico }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
