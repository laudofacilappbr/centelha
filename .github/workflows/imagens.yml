name: Imagens

# Validação de PR é local, em Docker (ci/validar.sh). Aqui só se publicam as imagens
# no GHCR quando algo entra na main, porque o deploy na VPS as baixa de lá.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  imagens:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - { servico: api, contexto: api, alvo: api }
          - { servico: worker, contexto: api, alvo: worker }
          - { servico: site, contexto: site, alvo: "" }
          - { servico: piper, contexto: infra/piper, alvo: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.contexto }}
          target: ${{ matrix.alvo }}
          push: true
          build-args: |
            PUBLIC_API_URL=${{ vars.PUBLIC_API_URL || 'https://api.centelha.com.br' }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/centelha-${{ matrix.servico }}:latest
            ghcr.io/${{ github.repository_owner }}/centelha-${{ matrix.servico }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.servico }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servico }}
