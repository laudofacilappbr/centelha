# Site estático do Centelha. TLS fica a cargo do proxy reverso / Cloudflare.
server {
    listen 80;
    listen [::]:80;
    server_name _;
    # Link para a versão no ar (regenerar/40-site-versao.sh e o site-construtor, #42).
    root /srv/site/atual;
    index index.html;

    server_tokens off;
    charset utf-8;

    # O proxy (Cloudflare) já termina TLS; redirecionamentos usam caminho relativo.
    absolute_redirect off;

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/xml application/json
               application/javascript text/javascript application/ld+json
               image/svg+xml application/manifest+json;

    error_page 404 /404.html;

    # Remove barra final: /sobre/ -> /sobre (URLs canônicas sem barra).
    rewrite ^/(.+)/$ /$1 permanent;

    # Assets com hash no nome: cache longo e imutável.
    location /_astro/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Imagens da marca, share image e favicons (sem hash): cache de 7 dias.
    location ~* ^/(brand|og)/|^/favicon {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=604800" always;
        try_files $uri =404;
    }

    # Áudio de demonstração (suporta Range nativamente).
    location /audio/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location = /404.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        internal;
    }

    # HTML e demais arquivos: cache curto (5 min), revalidando.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=300, must-revalidate" always;
        try_files $uri $uri.html $uri/ =404;
    }
}
