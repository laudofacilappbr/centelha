# Cabeçalhos de segurança (incluídos em cada location, pois add_header
# em um bloco location descarta os herdados do server).
# A política principal de CSP (script/style com hashes, connect-src da API)
# vem do <meta http-equiv> gerado pelo Astro; aqui só o que o meta não cobre.
add_header Content-Security-Policy "frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
