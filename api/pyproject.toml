[project]
name = "centelha-api"
version = "0.1.0"
description = "API do Centelha: catálogo, direitos, pipeline e lista de espera"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "ebooklib>=0.20",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "beautifulsoup4>=4.15.0",
]

[project.scripts]
centelha-ingestao = "centelha_api.pipeline.ingestao.cli:main"
centelha-lgpd = "centelha_api.lgpd:main"

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/centelha_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.flake8-bugbear]
# Depends() em default de argumento é o idioma do FastAPI.
extend-immutable-calls = ["fastapi.Depends"]
